[package]
name = "relay"
version = "0.1.0"
edition = "2024"
description = "Tiling terminal window manager for coding agents"

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["serde", "bracketed-paste", "events"] }
libc = "0.2.189"
portable-pty = "0.9.0"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
