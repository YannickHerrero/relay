[package]
name = "relay"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Tiling terminal window manager for coding agents"

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["serde", "bracketed-paste", "events"] }
http = "1"
libc = "0.2.189"
portable-pty = "0.9.0"
qrcode = { version = "0.14", default-features = false }
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "1.1.6"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
unicode-width = "0.2.2"
ureq = "3"
web-push-native = "0.5"
