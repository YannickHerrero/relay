[package]
name = "relay"
version = "0.1.0"
edition = "2024"
description = "Tiling terminal window manager for coding agents"

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29.0", features = ["serde", "bracketed-paste", "events"] }
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
